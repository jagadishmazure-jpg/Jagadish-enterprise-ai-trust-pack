# Offline CI: lint, tests, evidence freshness checks, brand check, secret scan. No cloud access.
name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - name: Install (pinned)
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests (offline)
        run: python -m pytest -q
      - name: Test count (printed, compared with README)
        run: |
          python scripts/count_tests.py | tee count.txt
          grep -q "$(cut -d' ' -f1 count.txt) tests" README.md || { echo "README test count is stale"; exit 1; }
      - name: Provenance manifest pins every component (fails on unpinned change)
        run: python -m trustpack provenance
      - name: Provenance change log regenerated
        run: python -m trustpack provenance --changelog --check
      - name: Trust portal page regenerated
        run: python -m trustpack portal --check
      - name: Residency configs pass
        run: python -m trustpack residency
      - name: Security suites gate
        run: python -m trustpack security
      - name: Documented output matches a fresh run
        run: python scripts/render_docs.py --check
      - name: No real brand names in code or sample data
        run: python scripts/check_brands.py

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - name: gitleaks (full history)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
