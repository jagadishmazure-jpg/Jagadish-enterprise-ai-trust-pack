# Infrastructure CI. Nothing here touches Azure: fmt, validate, mocked-provider test, tflint,
# checkov and bicep build only. There is no deploy workflow; applying the policies is a manual,
# approved step (see docs/implementation-guide.md).
name: infra
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: true
env:
  TF_VERSION: "1.16.4"
  TF_IN_AUTOMATION: "1"
  STACK: infra/terraform
jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with: { terraform_version: "${{ env.TF_VERSION }}", terraform_wrapper: false }
      - run: terraform -chdir="$STACK" fmt -check -recursive -diff
      - run: terraform -chdir="$STACK" init -backend=false -input=false
      - run: terraform -chdir="$STACK" validate
      - name: terraform test (offline plan with a mocked provider)
        run: terraform -chdir="$STACK" test

  tflint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4.1.1
        with: { tflint_version: v0.64.0, github_token: "${{ github.token }}" }
      - working-directory: ${{ env.STACK }}
        run: tflint --init && tflint --recursive --format compact

  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - run: pip install --quiet checkov==3.3.20
      - run: checkov -d "$STACK" --framework terraform --compact --quiet
      - run: checkov -d infra/bicep --framework bicep --compact --quiet

  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: bicep build (no Azure login needed)
        run: |
          az bicep install
          az bicep build --file infra/bicep/main.bicep --stdout > /dev/null
